[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "refaudit"
version = "2.0.0"
description = "Check the references in a .docx or .bib file against Crossref and OpenAlex, and check cited claims against the sources' own text."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-docx>=1.2",  # 1.2 adds Word comments
    "bibtexparser>=2.0",
    "openpyxl",
    "rapidfuzz",
    "pypdf",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
refaudit = "refaudit.cli:main"

[tool.setuptools]
packages = ["refaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = ["network: live test that calls Crossref, OpenAlex, DataCite and doi.org"]
